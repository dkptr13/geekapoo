    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _fetch = typeof _rawFetch === 'function' ? function() {
            return _rawFetch.apply(window, arguments);
          } : _rawFetch;

          var descriptor = {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e) {}

          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            }
          } catch (e) {}
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch of') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>

  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-violet-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <!-- Pantalla de arranque.
         Va FUERA de #root a propósito: React manda dentro de #root y
         este script no toca ese árbol. La versión anterior sí lo hacía
         y provocaba "Failed to execute 'removeChild'": React intentaba
         quitar un nodo que el aviso ya había borrado, y la app moría
         en negro. -->
    <div id="arranque" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#080810;color:#a1a1aa;font-family:Outfit,system-ui,sans-serif;padding:24px;text-align:center">
      <div id="arranque-spinner" style="width:40px;height:40px;border-radius:9999px;border:4px solid #7c3aed;border-top-color:transparent;animation:girar 1s linear infinite"></div>
      <p id="arranque-texto" style="margin:0;font-size:14px;max-width:420px;line-height:1.6">Cargando Geekapoo...</p>
      <button id="arranque-reload" onclick="location.reload()" style="display:none;padding:10px 20px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Recargar</button>
    </div>
    <style>@keyframes girar{to{transform:rotate(360deg)}}</style>
    <script>
      // Red de seguridad del arranque.
      //
      // Solo actúa si la app no llega a montar: HTML viejo en caché que
      // apunta a un JS que ya no existe, o un script bloqueado. Nunca
      // toca el DOM de React; solo quita o actualiza este cartel.
      (function () {
        var arranque = document.getElementById('arranque');
        var texto = document.getElementById('arranque-texto');
        var boton = document.getElementById('arranque-reload');
        var spinner = document.getElementById('arranque-spinner');
        var root = document.getElementById('root');

        var quitarArranque = function () {
          if (arranque && arranque.parentNode) {
            arranque.parentNode.removeChild(arranque);
          }
        };

        var avisar = function (mensaje) {
          if (!arranque || !arranque.parentNode) return;
          if (texto) texto.textContent = mensaje;
          if (boton) boton.style.display = 'inline-block';
          if (spinner) spinner.style.display = 'none';
        };

        // En cuanto React pinta algo, el cartel sobra. Se observa el
        // contenedor en vez de escribir en él: mezclar las dos cosas
        // es justo lo que rompía React con "removeChild".
        if (root) {
          var observador = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              observador.disconnect();
              quitarArranque();
            }
          });
          observador.observe(root, { childList: true });

          // Las fichas de anime llegan ya renderizadas desde el
          // servidor: si #root trae contenido, no hay nada que
          // esperar y el cartel se quita de inmediato.
          if (root.childElementCount > 0) quitarArranque();
        }

        window.addEventListener('error', function (e) {
          var objetivo = e.target;

          if (objetivo && objetivo.tagName === 'SCRIPT') {
            var src = objetivo.src || '';
            var esLaApp =
              /\/assets\/index-/.test(src) || /\/src\/main\.tsx/.test(src);

            // Un script ajeno bloqueado (analítica, extensión) no es
            // un fallo de la web. Se ignora.
            if (!esLaApp) return;

            // Una sola recarga para pedir el HTML nuevo; a la segunda
            // se avisa en vez de entrar en bucle.
            if (!sessionStorage.getItem('geekapoo-recarga')) {
              sessionStorage.setItem('geekapoo-recarga', '1');
              location.reload();
              return;
            }
            avisar('No se pudo cargar la aplicación. Recarga para intentarlo de nuevo.');
            return;
          }

          // Error de JavaScript antes de que React pinte nada.
          if (root && root.childElementCount === 0) {
            avisar('Algo falló al arrancar. Recarga para intentarlo de nuevo.');
          }
        }, true);

        setTimeout(function () {
          if (root && root.childElementCount === 0) {
            avisar('La carga está tardando más de lo normal. Puedes esperar o recargar.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
